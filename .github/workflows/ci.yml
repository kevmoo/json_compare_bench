name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Analyze & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # -------------------------------------------------------------
      # 1. Dart Validation
      # -------------------------------------------------------------
      - name: Dart Pub Get (Subproject)
        run: |
          cd dart
          dart pub get

      - name: Dart Pub Get (Root)
        run: dart pub get

      - name: Dart Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: Dart Analyze (Root & Tool)
        run: dart analyze --fatal-infos .

      - name: Dart Analyze (Subproject)
        run: |
          cd dart
          dart analyze --fatal-infos .

      # -------------------------------------------------------------
      # 2. Rust Validation
      # -------------------------------------------------------------
      - name: Rust Format Check
        run: |
          cd rust
          cargo fmt --check

      - name: Rust Clippy & Check
        run: |
          cd rust
          cargo clippy -- -D warnings

      # -------------------------------------------------------------
      # 3. Go Validation
      # -------------------------------------------------------------
      - name: Go Format & Vet Check
        run: |
          cd go
          test -z "$(gofmt -l .)"
          go vet ./...

      # -------------------------------------------------------------
      # 4. Node.js Validation
      # -------------------------------------------------------------
      - name: Node.js Syntax Check
        run: |
          cd node
          node --check index.mjs

      # -------------------------------------------------------------
      # 5. End-to-End Smoke Test
      # -------------------------------------------------------------
      - name: Run E2E Benchmark Smoke Test
        run: dart run tool/run_benchmarks.dart -d small.json --no-write-json --no-write-markdown
